name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Cache uv
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --frozen --no-install-project

    - name: Lint with flake8
      run: uv run flake8 .

    - name: Test with unittest
      run: uv run python -m unittest discover

  showcase:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: apps/showcase/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix apps/showcase

    - name: Test
      run: npm --prefix apps/showcase run test

    - name: Build
      run: npm --prefix apps/showcase run build

  browser-extension:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Validate Manifest and assets
      run: node scripts/validate-browser-extension.mjs
