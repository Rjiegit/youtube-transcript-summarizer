title = "openai-whisper Betterleaks configuration"
betterleaksMinVersion = "1.8.1"

# Runtime downloads, VCS internals, build outputs, and dependency caches are not
# repository source. Excluding them keeps directory scans bounded. Deliberately
# do not exclude .env or auth files here: if one is force-added, the staged scan
# must still reject it.
prefilter = '''
filter.matchesAny(get(attributes, "path", ""), [
  `^(?:\./)?\.git(?:/|$)`,
  `^(?:\./)?data(?:/|$)`,
  `^(?:\./)?apps/showcase/(?:node_modules|\.nuxt|\.output|coverage|dist)(?:/|$)`,
  `^(?:\./)?(?:\.venv|venv|env|__pycache__|\.ruff_cache|\.pytest_cache|\.mypy_cache)(?:/|$)`,
])
'''

# Allowlist only known placeholder values and only where fixtures/examples
# belong. Both the path and extracted secret must match. A provider-shaped or
# previously unseen value in the same files still reports.
filter = '''
let path = get(attributes, "path", "");
let secret = finding["secret"];

(
  filter.matchesAny(path, [
    `^(?:\./)?tests/`,
    `^(?:\./)?apps/showcase/(?:tests|test-data)/`,
    `^(?:\./)?\.archive/(?:tests/|test_)`,
  ]) &&
  filter.matchesAny(secret, [
    `^(?:secret|token|api-key|database-id|page-id)$`,
    `^(?:lock|openai|gemini|ollama)-(?:secret|key)$`,
    `^(?:test|env|runtime|nuxt|mock)_[a-z0-9_]+$`,
    `^(?:test|env|runtime|nuxt|mock)-[a-z0-9-]+$`,
  ])
)
||
(
  filter.matchesAny(path, [
    `^(?:\./)?\.env\.example$`,
    `^(?:\./)?apps/showcase/\.env\.example$`,
  ]) &&
  secret == "example-maintainer-token"
)
'''

[extend]
useDefault = true
