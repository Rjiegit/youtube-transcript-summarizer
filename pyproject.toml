[project]
name = "openai-whisper"
version = "0.0.0"
description = "YouTube 影片文字轉錄與摘要工具"
requires-python = ">=3.14"
dependencies = [
  "python-dotenv==1.1.1",
]

[dependency-groups]
api = [
  "fastapi==0.128.0",
  "notion-client==2.4.0",
  "uvicorn==0.32.1",
]
ui = [
  "requests==2.32.5",
  "streamlit==1.48.1",
]
worker = [
  "faster-whisper==1.2.0",
  "google-generativeai==0.8.5",
  "notion-client==2.4.0",
  "ollama==0.6.0",
  "openai==1.109.1",
  "pytubefix==9.4.1",
  "requests==2.32.5",
  "whisper==1.1.10",
]
dev = [
  "flake8",
  "httpx==0.28.1",
]

[tool.uv]
default-groups = ["api", "ui", "worker", "dev"]
