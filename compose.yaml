x-python-app: &python-app
  build:
    context: .
    dockerfile: .docker/Dockerfile
  environment:
    TZ: Asia/Taipei
  working_dir: /usr/src/app
  volumes:
    - ./:/usr/src/app
  tty: true
  restart: unless-stopped
  env_file:
    - .env

services:
  api:
    <<: *python-app
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: api
    command: ["bash", "-lc", "make yt-dlp-update && make api"]
    ports:
      - "8080:8080"

  streamlit:
    <<: *python-app
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: ui
    command:
      [
        "bash",
        "-lc",
        "uv run streamlit run whisper_summary/apps/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.fileWatcherType poll",
      ]
    environment:
      TZ: Asia/Taipei
      TASK_API_BASE_URL: "http://api:8080"
    ports:
      - "8501:8501"

  rss-monitor:
    <<: *python-app
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: worker
    command: ["bash", "-lc", "uv run python -m whisper_summary.apps.workers.rss_monitor"]
    environment:
      TZ: Asia/Taipei
      TASK_API_BASE_URL: "http://api:8080"

  processing-worker:
    <<: *python-app
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: worker
    command: ["bash", "-lc", "make yt-dlp-update && uv run python -m whisper_summary.apps.workers.processing_worker"]
    depends_on:
      - api
